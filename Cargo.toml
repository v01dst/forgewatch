[package]
name = "forgewatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Analyze the technical health of a local software project"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"

[profile.release]
codegen-units = 1
strip = true
